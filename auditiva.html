<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
  <script src="https://rawgit.com/mayognaise/aframe-gif-shader/master/dist/aframe-gif-shader.min.js"></script>
  <title>Aframe · Demo · Aprender emociones a11y</title>
</head>
<body>

  <a-scene xr-mode-ui="XRMode: xr" > 
    
    <!-- en esta demo hay que conseguir que el usuario aprenda las emociones sin audio -->
    <a-assets>
        <img id="gif" src="assets/images/prueba.gif" alt="prueba">
      </a-assets>




    <a-sphere grabbable position="-0.2 0.8 -0.3" radius="0.05" color="#EF2D5E" src="#gif"></a-sphere>
    <a-sphere grabbable position="0 0.8 -0.3" radius="0.05" color="yellow"></a-sphere>
    <a-sphere grabbable position="0.2 0.8 -0.3" radius="0.05" color="blue"></a-sphere>
      
    <a-entity>
      <a-entity camera look-controls wasd-controls position="0 1.6 1"></a-entity>
      <a-entity id="leftHand" hand-tracking-grab-controls="hand: left;"></a-entity>
      <a-entity id="rightHand" hand-tracking-grab-controls="hand: right;"></a-entity>  
    </a-entity>

  </a-scene>

</body>
</html>
