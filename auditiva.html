<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
  <script src="https://rawgit.com/mayognaise/aframe-gif-shader/master/dist/aframe-gif-shader.min.js"></script>
  <title>Aframe · Demo · Aprender emociones a11y</title>
</head>
<body>

  <a-scene xr-mode-ui="XRMode: xr">
    <!-- en esta demo hay que conseguir que el usuario aprenda las emociones sin audio -->
    <a-assets>
      <img id="gif" src="assets/images/prueba.gif" alt="prueba">        
      <video id="videoP" src="assets/videos/people.mp4" autoplay loop></video>
    </a-assets>

    <a-box position="-1 0.5 -3" rotation="0 45 0" color="#4CC3D9">
      <a-cylinder
        clickable
        class="buton" 
        id="generador" 
        position="0 0.5 0" 
        radius="0.5" 
        height="1.5" 
        color="gray" 
        scale="0.3 0.1 0.3"
        animation__down="
           property: position;
           to: 0 0.45 0;
           dur: 100;
           startEvents: pressdown;
         "
        animation__up="
           property: position;
           to: 0 0.5 0;
           dur: 100;
           startEvents: pressup;
         ">
      </a-cylinder>
      <a-text
        value="Generador \nde \nrecuerdos"
        scale="0.7 0.7 0.7"
        position="-0.1 0.1 0.7"
        align="center"
        color="white">
      </a-text>
    </a-box>


    <a-sphere grabbable position="-0.2 0.8 -0.3" radius="0.05" color="#EF2D5E" src="#videoP" data-memory="Rabia">
      <a-cylinder
        clickable
        class="buton" 
        id="buton1" 
        position="0 0.045 0" 
        radius="0.5" 
        height="1.5" 
        color="gray" 
        scale="0.052 0.015 0.052"
        animation__down="
           property: position;
           to: 0 0.036 0;
           dur: 100;
           startEvents: pressdown;
         "
        animation__up="
           property: position;
           to: 0 0.045 0;
           dur: 100;
           startEvents: pressup;
         ">
      </a-cylinder>
    </a-sphere>
    <a-sphere grabbable position="0 0.8 -0.3" radius="0.05" color="yellow" src="#videoP" data-memory="Alegria">
      <a-cylinder
        clickable
        class="buton" 
        id="buton2" 
        position="0 0.045 0" 
        radius="0.5" 
        height="1.5" 
        color="gray" 
        scale="0.052 0.015 0.052"
        animation__down="
           property: position;
           to: 0 0.036 0;
           dur: 100;
           startEvents: pressdown;
         "
        animation__up="
           property: position;
           to: 0 0.045 0;
           dur: 100;
           startEvents: pressup;
         ">
      </a-cylinder>
    </a-sphere>
    <a-sphere grabbable position="0.2 0.8 -0.3" radius="0.05" color="blue" src="#videoP" data-memory="Tristeza">
      <a-cylinder
        clickable 
        class="buton"
        id="buton3" 
        position="0 0.045 0" 
        radius="0.5" 
        height="1.5" 
        color="gray" 
        scale="0.052 0.015 0.052"
        animation__down="
           property: position;
           to: 0 0.036 0;
           dur: 100;
           startEvents: pressdown;
         "
        animation__up="
           property: position;
           to: 0 0.045 0;
           dur: 100;
           startEvents: pressup;
         ">
      </a-cylinder>
    </a-sphere>
      
    <a-videosphere id="pantalla"></a-videosphere>

    <a-text
      id="memoryDesc"
      value=""
      position="0 1.6 -2"
      color="white"
      align="center"
      width="4"
      look-at="#camera">
    </a-text>

    <a-entity>
      <a-entity id="camera" camera look-controls wasd-controls position="0 1.6 1"></a-entity>
      <a-entity cursor="rayOrigin:mouse"></a-entity>
      <a-entity id="leftHand" hand-tracking-grab-controls="hand: left;"></a-entity>
      <a-entity id="rightHand" hand-tracking-grab-controls="hand: right;"></a-entity>  
    </a-entity>

  </a-scene>

</body>
</html>


<script>
  const butons = document.querySelectorAll('.buton');
  const pantalla = document.querySelector('#pantalla');
  const memoryTxt = document.querySelector('#memoryDesc');
  const escena = document.querySelector('a-scene');

  butons.forEach(el => {
    el.addEventListener('click', function () {
      el.emit('pressdown');
      setTimeout(() => {
        el.emit('pressup');
      }, 100);

      //si he pulsado el botón de generación de un nuevo recuerdo
      if(el.getAttribute("id") == "generador"){
        //preguntar qué tipo de recuerdo (rojo, amarillo, azul)
        //ponerme en modo RA + ocultar recuerdos + grabar 10 secs

        //crear la nueva bola
        const elementoHTML = `
        <a-sphere grabbable position="0.4 0.8 -0.3" radius="0.05" color="blue" src="#videoP" data-memory="Tristeza">
          <a-cylinder 
            class="buton"
            id="buton4" 
            position="0 0.045 0" 
            radius="0.5" 
            height="1.5" 
            color="gray" 
            scale="0.052 0.015 0.052"
            animation__down="
              property: position;
              to: 0 0.036 0;
              dur: 100;
              startEvents: pressdown;
            "
            animation__up="
              property: position;
              to: 0 0.045 0;
              dur: 100;
              startEvents: pressup;
            ">
          </a-cylinder>
        </a-sphere>
        `;

        escena.insertAdjacentHTML("beforeend", elementoHTML);

        escena.lastElementChild.addEventListener('click', function () {
          this.emit('pressdown');
          setTimeout(() => {
            this.emit('pressup');
          }, 100);
        });

      }else{
        //si he pulsado el botón de cualquier recuerdo
        if(pantalla.getAttribute("src") == "" || pantalla.getAttribute("src") == null){
          pantalla.setAttribute("src", "#videoP");
          //document.querySelector("#videoP").play();
          pantalla.setAttribute("color", this.parentNode.getAttribute("color"))
          memoryTxt.setAttribute("value", this.parentNode.getAttribute("data-memory"))
        }else{
          pantalla.setAttribute("src", "");
          //document.querySelector("#videoP").pause();
          pantalla.setAttribute("color", "white")
        }
      }

       
    });
  });


</script>
