<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
  <title>Aframe · Ejemplo 13 · Foco de luz</title>
</head>
<body>
  <a-scene>
      
      <a-box position="-1 0.5 -3" rotation="0 45 0" color="#4CC3D9"></a-box>
      <a-sphere position="0 1.25 -5" radius="1.25" color="#EF2D5E"></a-sphere>
      <a-cylinder position="1 0.75 -3" radius="0.5" height="1.5" color="#FFC65D"></a-cylinder>
      
      <a-plane position="0 0 -4" rotation="-90 0 0" width="4" height="4" color="#7BC8A4"></a-plane>
      <a-sky color="#ECECEC"></a-sky>

      <a-light type="ambient" color="#ffffff" intensity="0.5"></a-light>  

      <!-- al foco de luz podemos configurarle la penumbra  -->
      <a-sphere color="yellow" position="0.1 2.5 -1.5" radius="0.2" >
            <a-light type="spot" color="#ffffaa" intensity="2" penumbra="0.07"></a-light>  
      </a-sphere>
    </a-scene>
</body>
</html>
