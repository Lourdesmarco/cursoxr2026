<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
  <title>Aframe · Ejemplo 3 · Primitivas Realidad Aumentada</title>
</head>
<body>
  <a-scene xr-mode-ui="XRMode: xr">
      <a-assets>
        <img id="azulejo1" src="assets/images/textura.jpeg" alt="textura azulejos grises">
      </a-assets>
      <a-box position="-1 0.5 -3" rotation="0 45 0" color="#4CC3D9"></a-box>
      <a-sphere position="0 1.25 -5" radius="1.25" color="#EF2D5E"></a-sphere>
      <a-cylinder position="1 0.75 -3" radius="0.5" height="1.5" color="#FFC65D"></a-cylinder>
      <a-plane position="0 0 -4" rotation="-90 0 0" width="4" height="4" color="#7BC8A4" src="#azulejo1"></a-plane>
      <a-sky hide-on-enter-ar color="#ECECEC"></a-sky>
    </a-scene>
</body>
</html>
