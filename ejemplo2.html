<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
  <title>Aframe · Ejemplo 2 · Casa con texturas</title>
</head>
<body>
  <a-scene>
      <a-assets>
        <img id="azulejo1" src="assets/textura.jpeg" alt="textura azulejos grises">

      <a-box position="-1.368 0.5 -3.536" scale="0.090 1.110 2.430" rotation="0 0 0" color="#4CC3D9"></a-box>
      <a-box position="1.168 0.5 -3.536" scale="0.090 1.110 2.430" rotation="0 0 0" color="#4CC3D9"></a-box>
      <a-box position="-0.098 0.5 -2.282" scale="0.090 1.110 2.630" rotation="0 90 0" color="#4CC3D9"></a-box>
      <!-- PUERTA -->
      <a-box position="-0.098 0.5 -4.707" scale="0.090 1.110 0.680" rotation="0 90 0" color="#aa7942"></a-box>
      
      <a-box position="0.723 0.5 -4.707" scale="0.090 1.110 0.940" rotation="0 90 0" color="#4CC3D9"></a-box>
      <a-box position="-0.923 0.5 -4.707" scale="0.090 1.110 0.940" rotation="0 90 0" color="#4CC3D9"></a-box>
      
      <a-plane position="0 0 -4" rotation="-90 0 0" width="4" height="4" color="#7BC8A4" src="#azulejo1"></a-plane>
      <a-sky color="#ECECEC"></a-sky>
    </a-scene>

</html>
