<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/n5ro/aframe-physics-system@v$npm_package_version/dist/aframe-physics-system.min.js"></script>

  <title>Aframe · Ejemplo 2 · Casa con texturas</title>
</head>
<body>
  <a-scene physics="debug: true">
      <a-assets>
        <img id="azulejo1" src="assets/textura.jpeg" alt="textura azulejos grises">
        <img id="fondo" src="assets/panorama2.jpg" alt="textura azulejos grises">
      </a-assets>

    <!-- Camera -->
     <a-entity position="0 1.6 -7" rotation="0 180 0">
        <a-entity camera look-controls ></a-entity>
     </a-entity>
      
      <a-entity hand-controls="hand: left"></a-entity>
      <a-entity hand-controls="hand: right"></a-entity>
      
      <a-box position="-1.368 0.972 -3.536" scale="0.090 2.000 2.430" rotation="0 0 0" color="#4CC3D9"></a-box>
      <a-box position="1.168 0.972 -3.536" scale="0.090 2.000 2.430" rotation="0 0 0" color="#4CC3D9"></a-box>
      <a-box position="-0.098 0.972 -2.282" scale="0.090 2.000 2.630" rotation="0 90 0" color="#4CC3D9"></a-box>
      <!-- PUERTA -->
      <a-box dynamic-body position="-0.098 0.900 -4.707" scale="0.090 1.800 0.680" rotation="0 90 0" color="#aa7942"></a-box>
      
      <a-box position="0.723 0.972 -4.707" scale="0.090 2.000 0.940" rotation="0 90 0" color="#4CC3D9"></a-box>
      <a-box position="-0.923 0.972 -4.707" scale="0.090 2.000 0.940" rotation="0 90 0" color="#4CC3D9"></a-box>
      
      <a-plane position="0 0 -4" rotation="-90 0 0" width="4" height="4" src="#azulejo1"></a-plane>
      <a-sky src="#fondo"></a-sky>
    </a-scene>
</body>
</html>
